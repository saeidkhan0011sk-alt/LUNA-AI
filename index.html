<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA - AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- আপনার দেওয়া মূল ড্যাশবোর্ড ও থ্রিডি ইন্টারফেস ব্যাকগ্রাউন্ড -->
    <div class="hud-screen">
      <div class="header-section">
        <span class="top-icon">A</span>
        <h1 class="luna-title">LUNA</h1>
        <button class="settings-gear" onclick="openSettings()">⚙️</button>
      </div>

      <!-- রোবটিক সিলভার ফেস (নীল চোখ) -->
      <div class="face-frame">
        <img src="luna-face.jpg" alt="Luna Face" id="luna-face">
      </div>

      <p id="status-text">Ready to Listen</p>

      <!-- ড্যাশবোর্ড গ্রিড অপশনসমূহ (আপনার ছবির আদলে) -->
      <div class="hud-grid">
        <div class="hud-card" onclick="openSection('profile')">
          <span class="card-icon">🧠</span>
          <h3>CUSTOM AI PROFILE</h3>
        </div>
        <div class="hud-card" onclick="openSection('search')">
          <span class="card-icon">🔍</span>
          <h3>CONTEXT SEARCH</h3>
        </div>
        <div class="hud-card" onclick="openSection('voice')">
          <span class="card-icon">🎙️</span>
          <h3>VOICE SETTINGS</h3>
        </div>
        <div class="hud-card" onclick="openSection('tasks')">
          <span class="card-icon">📊</span>
          <h3>TASK MANAGER</h3>
        </div>
      </div>

      <!-- নিচের চ্যাট ও ভয়েস বার -->
      <div class="bottom-control-bar">
        <button id="mic-toggle" onclick="toggleMic()">🎙️</button>
        <input type="text" id="user-input" placeholder="লুনার সাথে কথা বলুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">পাঠান</button>
      </div>
    </div>

    <!-- সেটিংস ও ভয়েস সিলেকশন মডাল -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <h3>লুনা সেটিংস ও কণ্ঠস্বর</h3>
        
        <label>Google Gemini API Key:</label>
        <input type="password" id="api-key-input" placeholder="আপনার এপিআই কি দিন">
        
        <label>কণ্ঠ বদটাও (মেয়ের কণ্ঠ বেছে নাও):</label>
        <select id="voice-select">
          <option value="voice1">লুনা - কণ্ঠ ১ (সফট ও মিষ্টি)</option>
          <option value="voice2">লুনা - কণ্ঠ ২ (স্মার্ট ও প্রফেশনাল)</option>
          <option value="voice3">লুনা - কণ্ঠ ৩ (বোল্ড ও ক্লিয়ার)</option>
        </select>

        <div class="modal-buttons">
          <button onclick="saveSettings()">সেভ করুন</button>
          <button onclick="closeSettings()" class="cancel-btn">বন্ধ করুন</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
