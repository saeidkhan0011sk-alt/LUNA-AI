<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>લUNA - Personal AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="space-background"></div>
  
  <div class="app-container">
    <!-- ৩ডি রোবটিক সিলভার ফেস ও আরজিবি গ্লোয়িং স্ক্রিন -->
    <div class="visual-screen">
      <div class="rgb-glow-ring"></div>
      <div class="ai-face-container">
        <!-- আপনার দেওয়া ইমেজ বা থ্রিডি সিলভার ফেস (নীল চোখ) -->
        <img src="luna-face.png" alt="Luna Face" id="luna-face">
      </div>
      <h1 class="ai-name">LUNA</h1>
      <p id="status-text">Ready to Listen...</p>
    </div>

    <!-- হোম পেজের ৬টিভ প্যানেল (Chat, Memory, Soul, Tasks, Headlines, Settings) -->
    <div class="dashboard-grid">
      <div class="dash-card" onclick="openPanel('chat')">
        <div class="icon">💬</div>
        <h3>CHAT</h3>
      </div>
      <div class="dash-card" onclick="openPanel('memory')">
        <div class="icon">🧠</div>
        <h3>MEMORY</h3>
      </div>
      <div class="dash-card" onclick="openPanel('soul')">
        <div class="icon">✨</div>
        <h3>SOUL</h3>
      </div>
      <div class="dash-card" onclick="openPanel('tasks')">
        <div class="icon">📋</div>
        <h3>TODAY TASKS</h3>
      </div>
      <div class="dash-card" onclick="openPanel('headlines')">
        <div class="icon">📰</div>
        <h3>TODAY HEADLINES</h3>
      </div>
      <div class="dash-card" onclick="openPanel('settings')">
        <div class="icon">⚙️</div>
        <h3>SETTINGS</h3>
      </div>
    </div>

    <!-- চ্যাট ও ভয়েস ইনপুট বার -->
    <div class="interaction-bar">
      <button id="mic-btn" onclick="toggleMic()">🎙️</button>
      <input type="text" id="user-input" placeholder="লুনার সাথে কথা বলুন..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">পাঠান</button>
    </div>

    <!-- সেটিংস ও কণ্ঠস্বর (Voice Options) মডাল -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <h3>লুনা সেটিংস</h3>
        
        <label>Google Gemini API Key:</label>
        <input type="password" id="api-key-input" placeholder="আপনার এপিআই কি দিন">
        
        <label>কণ্ঠ বদটাও (মেয়ের কণ্ঠ বেছে নাও):</label>
        <select id="voice-select">
          <option value="voice1">লুনা - কণ্ঠ ১ (সফট ও মিষ্টি)</option>
          <option value="voice2">লুনা - কণ্ঠ ২ (স্মার্ট ও প্রফেশনাল)</option>
          <option value="voice3">লুনা - কণ্ঠ ৩ (বোল্ড ও ক্লিয়ার)</option>
        </select>

        <div class="modal-buttons">
          <button onclick="saveSettings()">সেভ করুন</button>
          <button onclick="closeSettings()" class="cancel-btn">বন্ধ করুন</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
